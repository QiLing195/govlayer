<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>C-Former GovLayer · 企业知识治理演示</title>
<style>
  :root { --bg:#0f1115; --card:#181c23; --line:#262c36; --fg:#e6e9ef; --dim:#8b93a7;
          --ok:#3fb950; --warn:#d29922; --deny:#f85149; --accent:#4493f8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
         background:var(--bg); color:var(--fg); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:18px; }
  h1 small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  .wrap { max-width:900px; margin:0 auto; padding:24px; }
  .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  select, input, button { font-size:14px; padding:10px 12px; border-radius:8px;
        border:1px solid var(--line); background:var(--card); color:var(--fg); }
  input { flex:1; min-width:260px; }
  button { background:var(--accent); border:none; color:#fff; cursor:pointer; font-weight:600; }
  button:hover { opacity:.9; }
  .hint { color:var(--dim); font-size:12px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:16px 18px; margin-bottom:14px; }
  .tag { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px;
         margin-right:6px; font-weight:600; }
  .t-covered { background:rgba(63,185,80,.15); color:var(--ok); }
  .t-gap { background:rgba(210,153,34,.15); color:var(--warn); }
  .t-deny { background:rgba(248,81,73,.15); color:var(--deny); }
  .label { color:var(--dim); font-size:12px; margin:14px 0 6px; text-transform:uppercase;
           letter-spacing:.5px; }
  .answer { font-size:15px; line-height:1.7; white-space:pre-wrap; }
  .src { border-left:3px solid var(--accent); padding:8px 12px; margin:8px 0;
         background:rgba(68,147,248,.06); border-radius:0 8px 8px 0; font-size:14px; }
  .src b { color:var(--accent); }
  .denied { border-left-color:var(--deny); background:rgba(248,81,73,.06); }
  .note { font-size:13px; color:var(--warn); background:rgba(210,153,34,.08);
          padding:10px 12px; border-radius:8px; }
  .prec { font-size:13px; color:var(--dim); }
  .prec b { color:var(--fg); }
  .loading { color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>C-Former GovLayer <small>确定性治理层 · 权限隔离 / 空白识别 / 裁决留痕</small></h1>
</header>
<div class="wrap">
  <div class="controls">
    <select id="dataset"></select>
    <select id="identity"></select>
    <input id="question" placeholder="输入问题，例如：旷工超过多少天会被劝退？" />
    <button id="ask">提问</button>
    <button id="audit" style="background:#30363d">审计日志</button>
  </div>
  <div class="hint">
    身份由 <b>服务端令牌</b>决定（客户端无法伪造角色）——用不同身份问同一问题，
    可见内容层级不同：普通员工只能看公开条款，HR 才能看管理细则。
    每次提问都会留痕（谁·问了什么·为什么被截断），<b>审计日志本身也需 HR 级别</b>。
  </div>
  <div id="result"></div>
  <div id="auditpanel"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let DATASETS = [];

async function loadDatasets() {
  const res = await fetch("/api/datasets");
  DATASETS = await res.json();
  $("dataset").innerHTML = DATASETS.map(d => `<option value="${d.id}">${d.id}（${d.n_objects} 条知识）</option>`).join("");
}

async function loadIdentities() {
  // 身份来自服务端令牌（#3 安全修复：客户端不能自由声明角色）
  const res = await fetch("/api/tokens");
  const tokens = await res.json();
  $("identity").innerHTML = tokens
    .map(t => `<option value="${t.token}">${t.label}（级别 ${t.level}）</option>`).join("");
}

function verdictTag(v) {
  if (v === "covered") return '<span class="tag t-covered">明文可答</span>';
  if (v === "gap") return '<span class="tag t-gap">制度空白 · 升级</span>';
  if (v === "restricted") return '<span class="tag t-deny">权限受限</span>';
  return '<span class="tag t-deny">范围外</span>';
}

$("ask").addEventListener("click", ask);
$("question").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });

async function ask() {
  const q = $("question").value.trim();
  if (!q) return;
  $("result").innerHTML = '<div class="loading">治理层处理中…</div>';
  const res = await fetch("/api/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-API-Token": $("identity").value },
    body: JSON.stringify({ dataset: $("dataset").value, question: q }),
  });
  if (!res.ok) {
    const detail = await res.json().catch(() => ({}));
    $("result").innerHTML = `<div class="card">请求被拒绝（${res.status}）：${detail.detail || ""}</div>`;
    return;
  }
  const d = await res.json();
  const sources = d.visible_sources.map(s =>
    `<div class="src"><b>《${s.title}》</b><br/>${s.content || "（无权限查看）"}</div>`).join("");
  const denied = d.denied_fields.length
    ? `<div class="src denied"><b>已截断</b>：命中条目 ${d.denied_fields.join(", ")} 含更高权限字段，未向该角色展示</div>` : "";
  const prec = d.precedents.length ? `<div class="label">过往先例（仅供参考）</div>` +
    d.precedents.map(p => `<div class="prec"><b>${p.case_id}</b>（${p.date} · ${p.approver}）：${p.ruling}<br/>
      理由：${p.reasoning || "-"}<br/>⚠️ 仅供参考，以实际确认为准</div>`).join("") : "";
  const note = d.boundary_note ? `<div class="note">${d.boundary_note}</div>` : "";
  const typo = (d.typo_corrections && d.typo_corrections.length)
    ? `<div class="note" style="color:var(--accent);background:rgba(68,147,248,.08)">
        已自动纠错：${d.typo_corrections.join("、")}</div>` : "";
  $("result").innerHTML = `
    <div class="card">
      ${verdictTag(d.verdict)}
      <span class="tag" style="background:rgba(68,147,248,.15);color:var(--accent)">${d.identity || ("角色 " + d.role)}</span>
      ${d.llm_used ? '<span class="tag" style="background:rgba(68,147,248,.15);color:var(--accent)">LLM 生成</span>'
                   : '<span class="tag" style="background:rgba(139,147,167,.15);color:var(--dim)">条款原文</span>'}
      ${d.semantic_used ? '<span class="tag" style="background:rgba(63,185,80,.15);color:var(--ok)">LLM 语义检索</span>'
                        : (d.retrieval_mode === "hybrid"
                           ? '<span class="tag" style="background:rgba(63,185,80,.15);color:var(--ok)">本地混合检索</span>'
                           : '<span class="tag" style="background:rgba(139,147,167,.15);color:var(--dim)">关键词检索</span>')}
      ${typo}
      <div class="label">回答</div>
      <div class="answer">${d.answer_text}</div>
      <div class="label">依据（权限过滤后）</div>
      ${sources || '<div class="prec">无可展示依据</div>'}
      ${denied}
      ${prec}
      ${note}
    </div>`;
}

loadDatasets();
loadIdentities();

// ---- 审计日志面板（#5）：受权限门控，非 HR 会看到"被拒绝" ----
$("audit").addEventListener("click", loadAudit);

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function loadAudit() {
  $("auditpanel").innerHTML = '<div class="loading">读取审计日志…</div>';
  const res = await fetch("/api/audit?limit=20",
    { headers: { "X-API-Token": $("identity").value } });
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    $("auditpanel").innerHTML = `<div class="card">
      <span class="tag t-deny">被拒绝（${res.status}）</span>
      <div class="hint" style="margin:8px 0 0">${esc(d.detail || "")}</div>
      <div class="prec" style="margin-top:8px">审计日志同样受权限门控——连"谁查过什么"都不能随便看。</div>
    </div>`;
    return;
  }
  const d = await res.json();
  const s = d.stats || {};
  const rows = (d.records || []).map(r => `<tr>
      <td>${esc(r.ts)}</td><td>${esc(r.event)}</td>
      <td>${esc(r.role || r.identity_label || "-")}</td>
      <td>${esc(r.verdict || "-")}</td>
      <td>${esc(r.question || (r.question_sha256 ? "sha256:" + r.question_sha256 : "-"))}</td>
      <td>${esc((r.denied_fields || []).join(",") || "-")}</td>
      <td>${esc(r.latency_ms ?? "-")}</td></tr>`).join("");
  $("auditpanel").innerHTML = `<div class="card">
    <div class="label">审计汇总</div>
    <div class="prec">共 ${s.total} 条 · 已落盘 ${s.written_to_disk} 条 · 写盘失败 ${s.write_errors}
      · 鉴权失败 <b>${s.auth_failures}</b> 次 · 独立令牌指纹 ${s.unique_token_fingerprints} 个
      · 平均延迟 ${s.latency_ms_avg ?? "-"} ms · 最慢 ${s.latency_ms_max ?? "-"} ms</div>
    <div class="prec">判定分布：${esc(JSON.stringify(s.by_verdict || {}))}</div>
    <div class="prec">事件分布：${esc(JSON.stringify(s.by_event || {}))}</div>
    <div class="prec">日志文件：${esc(s.log_path || "")}（首次 ${esc(s.first_ts || "-")} ~ 最后 ${esc(s.last_ts || "-")}）</div>
    <div class="label">最近记录（最新在前）</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="color:var(--dim);text-align:left">
        <th>时间</th><th>事件</th><th>身份</th><th>判定</th><th>问题</th><th>截断</th><th>ms</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="7">暂无记录</td></tr>'}</tbody>
    </table>
    <div class="prec" style="margin-top:8px">⚠️ 日志只存令牌 SHA-256 指纹，不存令牌原文。</div>
  </div>`;
}
</script>
</body>
</html>
